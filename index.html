<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat - Profile & Avatar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styling untuk Navigasi Menu Bawah ala WhatsApp/Mobile App */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #fff;
            border-top: 1px solid #e9ecef;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }
        .nav-item {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: #6c757d;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #007bff;
        }
        /* Penyesuaian container agar tidak tertutup nav bawah */
        #home-screen .friends-list {
            padding-bottom: 70px;
        }
        .profile-menu-list {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px;
        }
        .profile-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            border: none;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .profile-menu-item.danger {
            color: #dc3545;
            background: #fff5f5;
        }
    </style>
</head>
<body>
    <!-- 1. SCREEN: LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h2>Masuk</h2>
            <p class="subtitle">Silakan masuk dengan akun kamu</p>
            
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" placeholder="Masukkan username" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Masukkan password">
            </div>
            <button id="btn-login" class="btn primary">Masuk</button>
            <p id="login-error" class="error"></p>
            
            <p class="switch-auth">Belum punya akun? <span id="to-register">Buat Akun</span></p>
        </div>
    </div>

    <!-- 2. SCREEN: REGISTER -->
    <div id="register-screen" class="screen">
        <div class="card">
            <h2>Buat Akun</h2>
            <p class="subtitle">Daftarkan username dan password kamu</p>
            
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" placeholder="Pilih username unik" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Buat password">
            </div>
            <div class="form-group">
                <label for="reg-confirm-password">Konfirmasi Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Ulangi password">
            </div>
            <button id="btn-register" class="btn primary">Daftar</button>
            <p id="reg-error" class="error"></p>
            
            <p class="switch-auth">Sudah punya akun? <span id="to-login">Masuk</span></p>
        </div>
    </div>

    <!-- 3. SCREEN: HOME / CONTACT LIST -->
    <div id="home-screen" class="screen">
        <div class="section-title" style="padding: 16px 16px 8px 16px; font-size: 18px; font-weight: bold;">Daftar Kontak</div>
        <div id="friends-list" class="friends-list"></div>

        <!-- Navigasi Bar di Bawah (Pesan / Kontak & Profil) -->
        <div class="bottom-nav">
            <button class="nav-item active">
                <span>💬</span>
                <span>Chat</span>
            </button>
            <button id="btn-open-profile" class="nav-item">
                <div id="my-header-avatar" class="friend-avatar" style="width: 24px; height: 24px; font-size: 11px;">-</div>
                <span>Profil</span>
            </button>
        </div>
    </div>

    <!-- 4. SCREEN: PROFILE & SETTINGS (Termasuk Tambah Teman & Logout di Bawah) -->
    <div id="profile-screen" class="screen">
        <div class="chat-header">
            <button id="btn-back-profile" class="btn-icon">←</button>
            <div class="chat-info">
                <h3>Profil & Pengaturan</h3>
            </div>
        </div>
        <div class="card" style="align-items: center; text-align: center; justify-content: flex-start; padding-top: 20px; overflow-y: auto;">
            <div id="profile-pic-container" style="position: relative; margin-bottom: 12px; cursor: pointer;">
                <div id="profile-large-avatar" class="friend-avatar" style="width: 80px; height: 80px; font-size: 32px;">-</div>
                <img id="profile-large-img" style="display: none; width: 80px; height: 80px; border-radius: 50%; object-fit: cover;" />
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            <button id="btn-change-photo" class="btn primary" style="width: auto; padding: 6px 14px; font-size: 12px;">Ganti Foto Profil</button>
            <p id="profile-status" class="error-small" style="color: #28a745; margin-top: 4px;"></p>
            
            <!-- Pengaturan di Bawah: Tambah Teman & Logout -->
            <div class="profile-menu-list">
                <div style="background: #f8f9fa; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-size: 13px; font-weight: 600; text-align: left; color: #495057;">Tambah Teman Baru</span>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="friend-username-input" placeholder="Cari username..." autocomplete="off" style="flex: 1; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; outline: none;">
                        <button id="btn-add-friend" class="btn primary" style="width: auto; padding: 8px 14px; font-size: 13px;">Tambah</button>
                    </div>
                    <p id="home-error" class="error-small" style="text-align: left; margin: 0;"></p>
                </div>

                <button id="btn-logout" class="profile-menu-item danger">
                    <span>Keluar (Logout)</span>
                    <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 5. SCREEN: CHAT ROOM -->
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <button id="btn-back" class="btn-icon">←</button>
            <div id="chat-partner-avatar-container" class="friend-avatar" style="width: 38px; height: 38px; font-size: 15px; flex-shrink: 0;">-</div>
            <div class="chat-info">
                <div>
                    <h3 id="chat-partner-name">Nama Teman</h3>
                    <span id="chat-status-indicator">Online</span>
                </div>
            </div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-container">
            <div id="reply-preview-box" class="reply-preview-box">
                <div class="reply-preview-content">
                    <strong id="replying-to-user">Membalas...</strong>
                    <span id="replying-to-text">Pesan...</span>
                </div>
                <button id="btn-cancel-reply" class="btn-cancel-reply">✕</button>
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
                <button id="btn-send" class="btn-send">Kirim</button>
            </div>
        </div>
    </div>

    <!-- MODAL OPSI PESAN -->
    <div id="message-options-modal" class="modal-backdrop">
        <div class="modal-content">
            <button id="opt-reply">Balas (Reply)</button>
            <button id="opt-delete-me">Hapus untuk Saya</button>
            <button id="opt-delete-all" class="danger-text">Hapus untuk Semua Orang</button>
            <button id="opt-cancel" class="cancel-btn">Batal</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
