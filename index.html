<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-screen" class="screen active">
        <div class="card">
            <h2>Private Chat</h2>
            <p class="subtitle">Aplikasi chat privat instan</p>
            
            <div class="form-group">
                <label for="username">Nama Kamu</label>
                <input type="text" id="username" placeholder="Masukkan namamu..." autocomplete="off">
            </div>

            <div class="divider"><span>ATAU</span></div>

            <div class="action-box">
                <button id="btn-create" class="btn primary">Buat Chat Baru</button>
            </div>

            <div class="divider"><span>GABUNG ROOM</span></div>

            <div class="form-group">
                <label for="room-code-input">Kode Room</label>
                <input type="text" id="room-code-input" placeholder="Contoh: A9B2C1" maxlength="6" autocomplete="off" style="text-transform: uppercase;">
            </div>
            <button id="btn-join" class="btn secondary">Gabung Chat</button>

            <p id="error-msg" class="error"></p>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <button id="btn-back" class="btn-icon">←</button>
            <div class="chat-info">
                <h3 id="room-title">Memuat...</h3>
                <span id="room-code-display">Kode: ------</span>
            </div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
            <button id="btn-send" class="btn-send">Kirim</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
