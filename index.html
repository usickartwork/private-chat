<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat - Profile & Avatar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. SCREEN: LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h2>Masuk</h2>
            <p class="subtitle">Silakan masuk dengan akun kamu</p>
            
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" placeholder="Masukkan username" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Masukkan password">
            </div>
            <button id="btn-login" class="btn primary">Masuk</button>
            <p id="login-error" class="error"></p>
            
            <p class="switch-auth">Belum punya akun? <span id="to-register">Buat Akun</span></p>
        </div>
    </div>

    <!-- 2. SCREEN: REGISTER -->
    <div id="register-screen" class="screen">
        <div class="card">
            <h2>Buat Akun</h2>
            <p class="subtitle">Daftarkan username dan password kamu</p>
            
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" placeholder="Pilih username unik" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Buat password">
            </div>
            <div class="form-group">
                <label for="reg-confirm-password">Konfirmasi Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Ulangi password">
            </div>
            <button id="btn-register" class="btn primary">Daftar</button>
            <p id="reg-error" class="error"></p>
            
            <p class="switch-auth">Sudah punya akun? <span id="to-login">Masuk</span></p>
        </div>
    </div>

    <!-- 3. SCREEN: HOME / CONTACT LIST -->
    <div id="home-screen" class="screen">
        <div class="home-header">
            <div class="my-profile-preview" id="btn-open-profile" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
                <div id="my-header-avatar" class="friend-avatar" style="width: 36px; height: 36px; font-size: 14px;">-</div>
                <div>
                    <h3 id="my-profile-name" style="font-size: 14px;">Halo, -</h3>
                    <span style="font-size: 11px; color: #0084ff;">Edit Profil & Foto</span>
                </div>
            </div>
            <button id="btn-logout" class="btn-icon-text">Keluar</button>
        </div>

        <div class="add-friend-box">
            <input type="text" id="friend-username-input" placeholder="Cari username teman..." autocomplete="off">
            <button id="btn-add-friend" class="btn primary">Tambah</button>
        </div>
        <p id="home-error" class="error-small"></p>

        <div class="section-title">Daftar Kontak</div>
        <div id="friends-list" class="friends-list"></div>
    </div>

    <!-- 4. SCREEN: PROFILE SETTINGS -->
    <div id="profile-screen" class="screen">
        <div class="chat-header">
            <button id="btn-back-profile" class="btn-icon">←</button>
            <div class="chat-info">
                <h3>Pengaturan Profil</h3>
            </div>
        </div>
        <div class="card" style="align-items: center; text-align: center; justify-content: flex-start; padding-top: 40px;">
            <div id="profile-pic-container" style="position: relative; margin-bottom: 20px; cursor: pointer;">
                <div id="profile-large-avatar" class="friend-avatar" style="width: 90px; height: 90px; font-size: 36px;">-</div>
                <img id="profile-large-img" style="display: none; width: 90px; height: 90px; border-radius: 50%; object-fit: cover;" />
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            <button id="btn-change-photo" class="btn primary" style="width: auto; padding: 10px 20px; font-size: 14px;">Pilih Foto Profil Baru</button>
            <p id="profile-status" class="error-small" style="color: #28a745;"></p>
        </div>
    </div>

    <!-- 5. SCREEN: CHAT ROOM -->
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <button id="btn-back" class="btn-icon">←</button>
            <div class="chat-info" style="display: flex; align-items: center; gap: 10px;">
                <div id="chat-partner-avatar-container">
                    <div id="chat-partner-avatar" class="friend-avatar" style="width: 36px; height: 36px; font-size: 14px;">-</div>
                </div>
                <div>
                    <h3 id="chat-partner-name">Nama Teman</h3>
                    <span id="chat-status-indicator">Online</span>
                </div>
            </div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-container">
            <div id="reply-preview-box" class="reply-preview-box">
                <div class="reply-preview-content">
                    <strong id="replying-to-user">Membalas...</strong>
                    <span id="replying-to-text">Pesan...</span>
                </div>
                <button id="btn-cancel-reply" class="btn-cancel-reply">✕</button>
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
                <button id="btn-send" class="btn-send">Kirim</button>
            </div>
        </div>
    </div>

    <!-- MODAL OPSI PESAN -->
    <div id="message-options-modal" class="modal-backdrop">
        <div class="modal-content">
            <button id="opt-reply">Balas (Reply)</button>
            <button id="opt-delete-me">Hapus untuk Saya</button>
            <button id="opt-delete-all" class="danger-text">Hapus untuk Semua Orang</button>
            <button id="opt-cancel" class="cancel-btn">Batal</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
